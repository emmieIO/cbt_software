services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "7000:80"
    env_file: .env
    volumes:
      - /var/www/cbt_software/storage:/var/www/html/storage
      - /var/www/cbt_software/.env:/var/www/html/.env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work
    env_file: .env
    volumes:
      - /var/www/cbt_software/storage:/var/www/html/storage
      - /var/www/cbt_software/.env:/var/www/html/.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
