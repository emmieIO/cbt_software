services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "7000:80"
    environment:
      - SERVER_NAME=:80
    env_file:
      - .env
    volumes:
      - /var/www/cbt_software:/var/www/html
      - /var/www/html/vendor        # Protects internal vendor
      - /var/www/html/public/build  # Protects internal Vite build
      - /var/www/html/storage       # Ensures storage is writable
    depends_on:
      - postgres
      - redis # Added this so app doesn't crash waiting for Redis

  worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work --max-jobs=1000 --max-time=3600
    env_file: .env
    volumes:
      - /var/www/cbt_software:/var/www/html
      - /var/www/html/vendor        # Added: Worker needs vendor too
      - /var/www/html/public/build  # Added: Some workers need access to assets
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
