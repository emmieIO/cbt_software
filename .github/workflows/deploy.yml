name: Chrisland CBT Deployment

on:
  push:
    branches: [master]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
        node-version: ['22']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, bcmath, gd, zip, pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Node Dependencies
        run: npm ci

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP Code Style (Pint)
        run: composer run lint

      - name: Lint Frontend (ESLint)
        run: npm run lint

      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate --with-form

      - name: Build Assets
        run: npm run build

      - name: Run Tests (Pest)
        run: php artisan test --compact

  deploy:
    needs: quality-assurance
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/cbt_software
            
            # Immediate environment cleanup to prevent boot errors during git pull/composer install
            rm -f bootstrap/cache/*.php
            rm -rf resources/js/actions
            
            if [ -f "deploy.sh" ]; then
              chmod +x deploy.sh
              ./deploy.sh
            else
              echo "deploy.sh not found, running manual fallback deployment..."
              
              git fetch origin master
              git reset --hard origin/master
              
              rm -f bootstrap/cache/*.php
              
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
              
              php artisan package:discover --ansi
              php artisan config:clear
              php artisan route:clear
              php artisan optimize:clear
              
              php artisan migrate --force
              php artisan db:seed --class=RolesAndPermissionsSeeder --force
              php artisan permission:cache-reset
              
              rm -rf resources/js/actions
              php artisan wayfinder:generate --with-form
              
              npm install
              npm run build
              
              php artisan storage:link || true
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              
              sudo chown -R www-data:www-data storage bootstrap/cache public/build
              sudo chmod -R 775 storage bootstrap/cache
              
              sudo systemctl restart frankenphp || php artisan queue:restart
            fi
